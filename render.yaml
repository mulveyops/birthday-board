services:
  - type: web
    name: birthday-board
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Supabase keys are set in the Render dashboard (Environment tab), not committed.
    # The anon key is public/frontend-safe, but keeping it out of git is tidy.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # SPA fallback: serve index.html for any path so client-side routing works.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
