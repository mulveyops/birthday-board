services:
  - type: web
    name: birthday-board
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Supabase keys are set in the Render dashboard (Environment tab), not committed.
    # The anon key is public/frontend-safe, but keeping it out of git is tidy.
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
    # index.html must never be served stale: the asset filenames inside it are
    # content-hashed, so a cached entry point pins the whole app to an old build.
    # (Render's CDN held it for 5 minutes by default, which made deploys look
    # like they had not landed.) The hashed assets themselves cache forever.
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    # SPA fallback: serve index.html for any path so client-side routing works.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
